[project]
name = "nasa-explorer-backend"
version = "0.1.0"
description = "FastAPI backend for NASA Explorer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.7",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
